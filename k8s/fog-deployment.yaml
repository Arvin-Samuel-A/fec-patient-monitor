apiVersion: apps/v1
kind: Deployment
metadata:
  name: fog-service
  labels:
    app: fog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fog-service
  template:
    metadata:
      labels:
        app: fog-service
    spec:
      containers:
      - name: fog
        image: fec-fog:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080   # HTTP API: /data, /alerts, /logs, /stats, /health
        env:
        - name: HTTP_PORT
          value: "8080"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
