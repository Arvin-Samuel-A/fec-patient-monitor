apiVersion: v1
kind: Service
metadata:
  name: fog-service
spec:
  type: NodePort
  selector:
    app: fog-service
  ports:
  - name: mtls-data
    port: 8444
    targetPort: 8444
    nodePort: 30444
    protocol: TCP
  - name: http-alerts
    port: 8445
    targetPort: 8445
    nodePort: 30445
    protocol: TCP
